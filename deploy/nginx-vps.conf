# Nginx da VPS (instalado direto no servidor, fora do Docker).
# Copie para /etc/nginx/sites-available/botanaconta, troque o domínio e ative.
# Depois rode: sudo certbot --nginx -d gastos.seudominio.com
# O Certbot adiciona o bloco HTTPS (443) e o redirecionamento de HTTP para HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name gastos.seudominio.com;

    server_tokens off;
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
