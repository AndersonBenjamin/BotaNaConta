# Nginx do container frontend: entrega o build do React e repassa /api para o backend.
# O HTTPS fica no Nginx da VPS, que encaminha para este container (ver deploy/nginx-vps.conf).

# Até 5 tentativas de login por minuto por IP, com folga de 5 seguidas.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16k;

    # Usa o IP real do visitante enviado pelo Nginx da VPS (necessário para o limite de login).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    # DNS interno do Docker; resolver em tempo de requisição evita IP antigo quando o backend é recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Arquivos com hash no nome: podem ficar em cache por 1 ano.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Rotas do React (ex.: /gastos/3) caem no index.html, que nunca fica em cache.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        return 429 '{"error":"Muitas tentativas. Aguarde um minuto e tente novamente."}';
    }
}
