# Cabeçalhos de segurança. Ficam num arquivo separado porque o Nginx descarta os
# add_header do server quando uma location define os seus; cada location inclui este arquivo.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# 'unsafe-inline' em style-src é necessário para a largura das barras do resumo (atributo style).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
